[project]
name = "indicquant"
version = "0.10.0"
description = "Indic document harness + AutoOpt (arXiv:2510.21436) on CPU"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Shivani Bhandari" }]
requires-python = ">=3.11"

dependencies = [
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]
docker = [
    "psycopg[binary]>=3.2",
    "redis>=5.0",
]

[project.scripts]
indicquant = "indicquant.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indicquant"]

[tool.hatch.build.targets.wheel.force-include]
"src/indicquant/agent/static/index.html" = "indicquant/agent/static/index.html"
"evals/indic_booking.json" = "indicquant/eval/cases.json"
"evals/documents.json" = "indicquant/eval/documents.json"
"evals/autoopt.json" = "indicquant/eval/autoopt.json"
"evals/scans.json" = "indicquant/eval/scans.json"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
