# sarvamai/sarvam-30b — verified against config.json and model.safetensors.index.json
# on 2026-08-18. See ARCHITECTURE.md §1.2 for provenance.

name: sarvam-30b
hf_id: sarvamai/sarvam-30b
revision: main
trust_remote_code: true
license: apache-2.0

# --- Verified architecture. Code reads these rather than hardcoding. ---
architecture:
  model_type: sarvam_moe
  class_name: SarvamMoEForCausalLM
  num_hidden_layers: 19
  first_k_dense_replace: 1        # layer 0 is dense → MoE layers are 1..18
  hidden_size: 4096
  num_experts: 128
  num_experts_per_tok: 6
  num_shared_experts: 1
  moe_intermediate_size: 1024
  num_attention_heads: 64
  num_key_value_heads: 4
  head_dim: 64
  vocab_size: 262144
  max_position_embeddings: 131072
  total_parameters: 32152650368

# --- Module naming. Sarvam does NOT use q_proj/k_proj/v_proj/o_proj. ---
# Stock quantization module maps silently miss these; see quant/sarvam_moe_adapter.py.
module_names:
  layers_path: model.layers
  gate: mlp.gate                  # SarvamMoEGate — the RQ4 hook point
  experts: mlp.experts            # ModuleList[128] of SarvamMoEMLP, unfused 2D linears
  expert_projections: [gate_proj, up_proj, down_proj]
  shared_experts: mlp.shared_experts
  attention_qkv: attention.query_key_value   # fused
  attention_out: attention.dense
  dense_mlp: mlp                  # layer 0 only

# --- Resource footprint, used by scripts/cost_estimate.py ---
footprint:
  disk_fp32_gb: 128.6
  disk_bf16_gb: 64.3
  disk_int4_gb: 20.0              # W4A16 group-128 + bf16 embeddings
  disk_int8_gb: 34.0
  min_gpu_memory_gb: 80
  recommended_gpu: "1x H200 141GB"
