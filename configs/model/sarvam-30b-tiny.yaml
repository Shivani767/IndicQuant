# Tiny random-init SarvamMoE for the CPU dev loop.
#
# This is NOT a lookalike. SarvamMoEConfig takes every dimension as a plain constructor
# kwarg (verified in configuration_sarvam_moe.py), so this instantiates the *real*
# SarvamMoEGate / SarvamMoESparseMoeBlock classes from sarvam's remote code at ~5M params.
# Hooks, metrics, storage and CLI plumbing are therefore tested against genuine Sarvam
# code paths on a laptop, before the 128.6 GB download.
#
# Weights are random. Nothing measured here is a research result — this exists to prove
# the pipeline runs.

name: sarvam-30b-tiny
hf_id: sarvamai/sarvam-30b       # remote code is pulled from here; weights are NOT
revision: main
trust_remote_code: true
random_init: true                # build from config, download no safetensors

architecture:
  model_type: sarvam_moe
  class_name: SarvamMoEForCausalLM
  num_hidden_layers: 3
  first_k_dense_replace: 1        # → 2 MoE layers (1, 2), mirroring the real topology
  hidden_size: 128
  intermediate_size: 256
  num_experts: 8
  num_experts_per_tok: 2
  num_shared_experts: 1
  moe_intermediate_size: 64
  num_attention_heads: 4
  num_key_value_heads: 2
  head_dim: 32
  vocab_size: 1000
  max_position_embeddings: 512
  n_group: 1
  topk_group: 1

module_names:
  layers_path: model.layers
  gate: mlp.gate
  experts: mlp.experts
  expert_projections: [gate_proj, up_proj, down_proj]
  shared_experts: mlp.shared_experts
  attention_qkv: attention.query_key_value
  attention_out: attention.dense
  dense_mlp: mlp

footprint:
  disk_fp32_gb: 0.02
  min_gpu_memory_gb: 0
  recommended_gpu: "none — CPU"
