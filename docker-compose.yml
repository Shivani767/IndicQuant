services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: indicquant
      POSTGRES_PASSWORD: indicquant
      POSTGRES_DB: indicquant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indicquant -d indicquant"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "7861:7860"
    environment:
      DATABASE_URL: postgresql://indicquant:indicquant@postgres:5432/indicquant
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
